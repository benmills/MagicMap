name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r tools/requirements-dev.txt
      - name: Lua syntax and globals
        run: python3 tools/luacheck.py
      - name: Tools, data and smoke tests
        run: python3 -m pytest tools/tests -q
