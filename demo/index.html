<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Atlas" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext x='2' y='25' font-size='30' fill='%23e2c383'%3E✦%3C/text%3E%3C/svg%3E"
    />
    <title>MagicMap · Addon demo</title>
    <!-- Label faces (see labels.js): Cinzel for Morpheus's titles, Marcellus for Friz Quadrata. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Marcellus&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <canvas id="terrain" aria-hidden="true" hidden></canvas>
    <canvas id="map" aria-label="World map" tabindex="0"></canvas>
    <nav id="ui" aria-label="Map controls">
      <button id="menuBtn" aria-expanded="false" aria-controls="settings">Menu</button>
      <button id="viewBtn" aria-pressed="false" aria-label="3D terrain" title="Switch to 3D terrain">3D</button>
      <div id="northControls">
      <button id="compass" aria-label="Reset bearing north" title="North"><span>↑</span></button>
      <button id="flyover" aria-pressed="false" aria-label="Start flyover" title="Start flyover" hidden>▶</button>
      </div>
    </nav>
    <!-- One menu, iOS-like: a root list, and pages it opens (each with a way back). On a phone it's a bottom sheet. -->
    <section id="settings" class="panel sheet" aria-label="Menu" hidden>
      <div class="sheet-bar"><h2>Menu</h2><button class="x" data-close-sheet aria-label="Close menu">✕</button></div>
      <div class="group">
        <button id="searchBtn" class="row nav">Search</button>
        <label class="row pick">Go to zone<select id="zone" aria-label="Go to zone"><option value="">None</option></select></label>
      </div>
      <div class="group">
        <button id="layersBtn" class="row nav" aria-expanded="false" aria-controls="layerSheet">Show on Map</button>
        <button id="toolsBtn" class="row nav" aria-expanded="false" aria-controls="tools">Terrain</button>
      </div>
      <div class="group">
        <button id="share" class="row" title="Copy a link to this view">Share This View</button>
      </div>
      <div id="hl" hidden><span></span><button class="x" aria-label="Clear highlight">✕</button></div>
    </section>
    <section id="searchSheet" class="panel sheet" aria-label="Search" hidden>
      <div class="sheet-bar"><button class="back" data-back aria-label="Back to menu">Menu</button><h2>Search</h2><button class="x" data-close-sheet aria-label="Close search">✕</button></div>
      <input id="q" type="search" placeholder="NPCs, quests, items, places"
        autocomplete="off" autocorrect="off" spellcheck="false"
        enterkeyhint="search" aria-label="Search maps and entities" />
      <div id="results" role="region" aria-label="Search results"></div>
    </section>
    <section id="layerSheet" class="panel sheet" aria-label="Show on map" hidden>
      <div class="sheet-bar"><button class="back" data-back aria-label="Back to menu">Menu</button><h2>Show on Map</h2><button class="x" data-close-sheet aria-label="Close">✕</button></div>
      <h3>Pins</h3>
      <div id="layers" class="group"></div>
      <h3>Names &amp; scenery</h3>
      <div id="baseLayers" class="group"></div>
    </section>
    <section id="tools" class="panel sheet" aria-label="Terrain" hidden>
      <div class="sheet-bar"><button class="back" data-back aria-label="Back to menu">Menu</button><h2>Terrain</h2><button class="x" data-close-sheet aria-label="Close">✕</button></div>
      <div id="tiltWrap" hidden>
        <h3>Camera</h3>
        <div class="group">
          <div class="bearing row"><button id="rotateLeft" aria-label="Rotate left">↶</button><label for="tilt">Tilt <output id="tiltValue">45°</output></label><button id="rotateRight" aria-label="Rotate right">↷</button></div>
          <div class="row"><input id="tilt" type="range" min="0" max="65" value="45" aria-label="3D tilt" /></div>
        </div>
        <small id="gestureHint">Drag to pan · two fingers: pinch, rotate, slide to tilt</small>
        <small id="flyoverHint">Drag or use a control to pause</small>
      </div>
      <h3>Overlays</h3>
      <div class="group">
        <label class="row"><span>Elevation</span><input type="checkbox" data-tool="elevation" /></label>
        <label class="row"><span>Slope</span><input type="checkbox" data-tool="slope" /></label>
        <label class="row"><span>Contours</span><input type="checkbox" data-tool="contours" /></label>
        <label class="row"><span>Walk grid</span><input type="checkbox" data-tool="walk" /></label>
      </div>
      <div class="group">
        <button id="profile" class="row" aria-pressed="false">Measure a Ground Profile</button>
      </div>
      <div id="profileResult"></div>
    </section>
    <nav id="viewControls" aria-label="Zoom controls">
      <button id="zoomIn" aria-label="Zoom in">+</button>
      <button id="zoomOut" aria-label="Zoom out">−</button>
    </nav>
    <div
      id="status"
      class="panel"
      role="status"
      aria-live="polite"
      hidden
    ></div>
    <div id="readout" class="panel"></div>
    <div id="scaleWrap">
      <div></div>
      <span id="scale"></span>
    </div>
    <section
      id="card"
      class="panel"
      aria-label="Selection details"
      hidden
    ></section>
    <script src="core.js" defer></script>
    <script src="tiles.js" defer></script>
    <script src="labels.js" defer></script>
    <script src="pins.js" defer></script>
    <script src="tools.js" defer></script>
    <script src="flyover.js" defer></script>
    <script src="navigation.js" defer></script>
    <script src="cards.js" defer></script>
    <script src="mapart.js" defer></script>
    <script src="app.js" defer></script>
  </body>
</html>
