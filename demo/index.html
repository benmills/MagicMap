<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Atlas" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext x='2' y='25' font-size='30' fill='%23e2c383'%3E✦%3C/text%3E%3C/svg%3E"
    />
    <title>MagicMap · Addon demo</title>
    <!-- Label faces (see labels.js): Cinzel for Morpheus's titles, Marcellus for Friz Quadrata. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Marcellus&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <canvas id="terrain" aria-hidden="true" hidden></canvas>
    <canvas id="map" aria-label="World map" tabindex="0"></canvas>
    <!-- The controls: one column in the bottom right, in reach of a thumb. North shows only while the view is turned
         or tilted; the menu opens beside the column, from the bottom up. -->
    <nav id="controls" aria-label="Map controls">
      <button id="compass" aria-label="Reset to north" title="North" hidden><span>↑</span></button>
      <button id="flyover" aria-pressed="false" aria-label="Start flyover" title="Start flyover" hidden>▶</button>
      <button id="viewBtn" aria-pressed="false" aria-label="3D terrain" title="Switch to 3D terrain">3D</button>
      <button id="zoomIn" aria-label="Zoom in" title="Zoom in">+</button>
      <button id="zoomOut" aria-label="Zoom out" title="Zoom out">−</button>
      <button id="menuBtn" aria-expanded="false" aria-controls="settings" aria-label="Menu" title="Menu"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14M5 12h14M5 17h14"/></svg></button>
    </nav>
    <!-- One small menu: two switches, Share, and Advanced (a page in its place; its first row goes back). Tapping
         outside closes it. -->
    <section id="settings" class="panel sheet" aria-label="Menu" hidden>
      <div class="group">
        <label class="row"><input type="checkbox" id="pinsAll" /><span>Map Pins</span></label>
        <label class="row"><input type="checkbox" id="namesAll" /><span>Zone Names</span></label>
        <button id="share" class="row" title="Copy a link to this view"><span>Share This View</span></button>
        <button id="advancedBtn" class="row nav" aria-expanded="false" aria-controls="advanced"><span>Advanced</span></button>
      </div>
    </section>
    <!-- Advanced: everything shown on the map (all off or on in one tap, and each section's header its whole section),
         then the terrain's tools. -->
    <section id="advanced" class="panel sheet" aria-label="Advanced" hidden>
      <button class="row back" data-back>Advanced</button>
      <div id="layerSheet">
        <div class="group">
          <button id="allLayers" class="row"><span>Hide All</span></button>
        </div>
        <div class="group">
          <label class="row head"><input type="checkbox" data-all="layers" /><span>Pins</span></label>
          <div id="layers"></div>
        </div>
        <div class="group">
          <label class="row head"><input type="checkbox" data-all="baseLayers" /><span>Names &amp; Scenery</span></label>
          <div id="baseLayers"></div>
        </div>
      </div>
      <div id="tiltWrap" class="group" hidden>
        <div class="row head"><span>3D Camera</span></div>
        <div class="bearing row"><button id="rotateLeft" aria-label="Rotate left">↶</button><label for="tilt">Tilt <output id="tiltValue">45°</output></label><button id="rotateRight" aria-label="Rotate right">↷</button></div>
        <div class="row"><input id="tilt" type="range" min="0" max="65" value="45" aria-label="3D tilt" /></div>
        <small id="gestureHint">Drag to pan · two fingers: pinch, rotate, slide to tilt</small>
        <small id="flyoverHint">Drag or use a control to pause</small>
      </div>
      <div class="group">
        <label class="row head"><input type="checkbox" data-all="overlays" /><span>Terrain Overlays</span></label>
        <div id="overlays">
          <label class="row"><input type="checkbox" data-tool="elevation" /><span>Elevation</span></label>
          <label class="row"><input type="checkbox" data-tool="slope" /><span>Slope</span></label>
          <label class="row"><input type="checkbox" data-tool="contours" /><span>Contours</span></label>
          <label class="row"><input type="checkbox" data-tool="walk" /><span>Walk Grid</span></label>
        </div>
      </div>
      <div class="group">
        <button id="profile" class="row" aria-pressed="false"><span>Measure a Ground Profile</span></button>
      </div>
      <div id="profileResult"></div>
    </section>
    <!-- A tap on the map: the zone and the place there, and two ways in. -->
    <section id="place" class="panel" aria-label="Place" hidden>
      <div class="names"><b></b><small></small></div>
      <button id="placeZoom" aria-label="Zoom in here" title="Zoom in"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21M10.5 7.5v6M7.5 10.5h6"/></svg></button>
      <button id="place3D" aria-label="Zoom in with 3D" title="Zoom in with 3D"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 19.5 9 9l3.5 5.5L15 11l6.5 8.5z"/></svg></button>
    </section>
    <div
      id="status"
      class="panel"
      role="status"
      aria-live="polite"
      hidden
    ></div>
    <script src="core.js" defer></script>
    <script src="tiles.js" defer></script>
    <script src="labels.js" defer></script>
    <script src="pins.js" defer></script>
    <script src="tools.js" defer></script>
    <script src="flyover.js" defer></script>
    <script src="navigation.js" defer></script>
    <script src="menu.js" defer></script>
    <script src="mapart.js" defer></script>
    <script src="app.js" defer></script>
  </body>
</html>
